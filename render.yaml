# Blueprint de Render para el backend de GameUP (NestJS).
# Render lo detecta al crear "New > Blueprint" con este repositorio.
# Los secretos (DATABASE_URL, SUPABASE_SECRET_KEY) NO van aquí: Render los
# pide al crear el servicio (sync: false) y se guardan solo en Render.
services:
  - type: web
    name: gameup-backend
    runtime: node
    plan: free
    region: oregon
    branch: main
    # El backend vive en una subcarpeta del repositorio.
    rootDir: GameUp-backend
    # --include=dev: el build necesita @nestjs/cli y typescript (devDependencies)
    # aunque NODE_ENV sea production. postinstall ejecuta "prisma generate".
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Render pone un proxy delante del servicio.
      - key: TRUST_PROXY_HOPS
        value: "1"
      # Supabase > Connect > "Session pooler" (Render no tiene IPv6, así que
      # la conexión directa db.<ref>.supabase.co no funciona).
      - key: DATABASE_URL
        sync: false
      # URL que Render asigna, ej.: https://gameup-backend.onrender.com
      - key: PUBLIC_URL
        sync: false
      # URL base de la API de seguridad (login y perfil), sin /api al final.
      - key: SEGURIDAD_API_URL
        sync: false
      - key: SEGURIDAD_API_TIMEOUT_MS
        value: "5000"
      - key: AUTH_CACHE_TTL_SEG
        value: "300"
      # Alta automática en el primer login: roles de GameUP separados por
      # comas. Para apagarla, deja el valor vacío (vuelve el alta manual
      # con POST /usuarios). El ESTUDIANTE además necesita ASISCO_API_URL.
      - key: ALTA_AUTOMATICA_ROLES
        value: "ESTUDIANTE,ACUDIENTE,TALLERISTA,DIRECTORA"
      # ASISCO UP: consentimiento, vínculos de acudientes y el idEstudiante
      # del alta automática (lectura).
      - key: ASISCO_API_URL
        value: "https://proyecto-asiscoup-g1-jvaz.onrender.com"
      - key: ASISCO_API_TIMEOUT_MS
        value: "15000"
      # Caché del consentimiento de voz (segundos, máx. 300). Un retiro de la
      # autorización tarda hasta este plazo en aplicarse.
      - key: CONSENTIMIENTO_CACHE_SEG
        value: "120"
      # Nunca true en producción (la app no arrancaría).
      - key: CONSENTIMIENTO_SIMULADO
        value: "false"
      # Limpieza de grabaciones de voz (minutos; 0 la desactiva).
      - key: LIMPIEZA_GRABACIONES_MIN
        value: "30"
      # Límite de peticiones (429). Ventanas en segundos. Global holgado por
      # IP porque los celulares de la fundación comparten la Wi-Fi.
      - key: THROTTLE_GLOBAL_LIMITE
        value: "600"
      - key: THROTTLE_GLOBAL_VENTANA_SEG
        value: "60"
      - key: THROTTLE_LOGIN_LIMITE
        value: "10"
      - key: THROTTLE_LOGIN_VENTANA_SEG
        value: "60"
      - key: THROTTLE_LOGIN_IP_LIMITE
        value: "100"
      - key: THROTTLE_LOGIN_IP_VENTANA_SEG
        value: "60"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
